<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>McKenna's Travel Prints</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            background-color: #cceeff; 
            margin: 0; 
            padding: 0; 
        }
     
        .banner { 
            background-image: url('banner.jpg'); 
            height: 220px; 
            background-size: cover; 
            background-position: center; 
            display: flex; 
            flex-direction: column;
            align-items: center; 
            justify-content: center; 
            color: white; 
            font-size: 42px; 
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        nav { 
            background-color: #267aa3; 
            padding: 15px; 
            text-align: center; 
        }
        nav a { 
            color: white; 
            margin: 0 15px; 
            text-decoration: none; 
            font-weight: bold; 
        }
        .container { padding: 20px; text-align: center; }
        .products { 
            display: flex; 
            flex-wrap: wrap; 
            justify-content: center; 
        }
        .product { 
            background-color: white; 
            width: 250px; 
            margin: 15px; 
            padding: 15px; 
            border-radius: 12px; 
            text-align: center; 
            box-shadow: 0 0 10px rgba(0,0,0,0.1); 
        }
        .product img { 
            width: 100%; 
            border-radius: 10px; 
            height: 200px; 
            object-fit: cover; 
        }
        button, .contact-link { 
            background-color: #3399cc; 
            color: white; 
            border: none; 
            padding: 10px 20px; 
            margin-top: 10px; 
            cursor: pointer; 
            border-radius: 5px; 
            text-decoration: none;
            display: inline-block;
        }
        button:hover, .contact-link:hover { background-color: #267aa3; }
        footer { 
            background-color: #3399cc; 
            color: white; 
            text-align: center; 
            padding: 15px; 
            margin-top: 20px; 
        }
    </style>
</head>
<body>

<div class="banner">
    McKenna's Travel Prints

    <a href="#">About</a>

        <div class="product">
